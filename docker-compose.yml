version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: edustream-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: edustream
    volumes:
      - mongodb_data:/data/db

  # LiveKit Server
  livekit:
    image: livekit/livekit-server:latest
    container_name: edustream-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"  # WebSocket
      - "7881:7881"  # HTTP
      - "50000-50100:50000-50100/udp"  # RTC/UDP
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml

volumes:
  mongodb_data:
    driver: local
