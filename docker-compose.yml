version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: edustream-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: edustream
    volumes:
      - mongodb_data:/data/db

  # Redis (required for LiveKit Egress coordination)
  redis:
    image: redis:7-alpine
    container_name: edustream-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # LiveKit Server
  livekit:
    image: livekit/livekit-server:latest
    container_name: edustream-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"  # WebSocket
      - "7881:7881"  # HTTP
      - "50000-50100:50000-50100/udp"  # RTC/UDP
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    command: --config /etc/livekit.yaml
    depends_on:
      - redis

  # LiveKit Egress (room recording processor)
  egress:
    image: livekit/egress:latest
    container_name: edustream-egress
    restart: unless-stopped
    environment:
      - EGRESS_CONFIG_FILE=/etc/livekit/egress.yaml
    volumes:
      - ./egress.yaml:/etc/livekit/egress.yaml
      - ./recordings:/recordings
    cap_add:
      - SYS_ADMIN
    depends_on:
      - livekit
      - redis

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
