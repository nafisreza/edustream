name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Type check
        run: npm run check-types || echo "Type check script not found, skipping..."
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Create .env files
        run: |
          echo "MONGODB_URI=mongodb://localhost:27017/edustream-test" > apps/server/.env
          echo "JWT_SECRET=test-secret-key-for-ci" >> apps/server/.env
          echo "LIVEKIT_API_KEY=test-key" >> apps/server/.env
          echo "LIVEKIT_API_SECRET=test-secret" >> apps/server/.env
          echo "LIVEKIT_URL=http://localhost:7880" >> apps/server/.env
          echo "NEXT_PUBLIC_API_URL=http://localhost:5000" > apps/web/.env.local
          echo "NEXT_PUBLIC_WS_URL=http://localhost:5000" >> apps/web/.env.local
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build
        run: npm run build

  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test || echo "No tests configured yet"
        continue-on-error: true
